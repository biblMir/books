<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Каталог книг для чтения." />
    <title>Мои книги</title>
    <style>
      :root {
        --bg: #f5f5f7;
        --card: #ffffff;
        --ink: #1d1d1f;
        --ink-soft: #6e6e73;
        --ink-faint: #86868b;
        --accent: #c2410c;
        --accent-dark: #9a3412;
        --line: #e8e8ed;
        --radius: 20px;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.05);
        --shadow-hover:
          0 2px 6px rgba(0, 0, 0, 0.05), 0 20px 44px rgba(0, 0, 0, 0.12);
        /* настраиваемое из админки */
        --font-stack:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        --h1-size: 60px;
        --h1-weight: 700;
        --name-size: 16px;
        --name-weight: 600;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      html,
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-stack);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        line-height: 1.45;
      }

      ::selection {
        background: color-mix(in srgb, var(--accent) 18%, transparent);
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 88px 24px 72px;
      }

      /* ——— Hero ——— */
      .hero {
        text-align: center;
        max-width: 720px;
        margin-bottom: 40px;
        animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .eyebrow {
        display: inline-block;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-faint);
        margin-bottom: 18px;
      }
      h1 {
        font-size: clamp(34px, calc(var(--h1-size) / 60 * 6vw), var(--h1-size));
        font-weight: var(--h1-weight);
        letter-spacing: -0.03em;
        line-height: 1.05;
        margin-bottom: 18px;
      }
      .subtitle {
        font-size: clamp(16px, 2vw, 19px);
        color: var(--ink-soft);
        max-width: 560px;
        margin: 0 auto;
        text-wrap: balance;
      }

      /* ——— Поиск ——— */
      .search {
        width: 100%;
        max-width: 1080px;
        margin-bottom: 34px;
        animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both;
        animation-delay: 150ms;
      }
      .search input {
        width: 100%;
        font: inherit;
        font-size: clamp(17px, 2vw, 19px);
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 980px;
        padding: 18px 26px 18px 58px;
        box-shadow: var(--shadow);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="%2386868b" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>');
        background-repeat: no-repeat;
        background-position: 22px 50%;
      }
      .search input::placeholder {
        color: var(--ink-faint);
      }
      .search input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow:
          0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent),
          var(--shadow-hover);
      }

      /* ——— Сетка книг (карточки с обложками, как в книжном магазине) ——— */
      .books {
        width: 100%;
        max-width: 1080px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 22px;
      }

      .book {
        display: flex;
        flex-direction: column;
        text-decoration: none;
        color: inherit;
        font: inherit;
        text-align: left;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both;
        animation-delay: calc(min(var(--i), 12) * 55ms + 200ms);
        transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .book:hover {
        transform: translateY(-5px);
      }
      .book:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
        border-radius: 16px;
      }
      .book.hidden-by-search {
        display: none;
      }

      .cover {
        position: relative;
        aspect-ratio: 3 / 4;
        border-radius: 16px;
        overflow: hidden;
        background:
          linear-gradient(135deg, #e8e8ed 0%, #f5f5f7 100%);
        box-shadow: var(--shadow);
        transition: box-shadow 0.35s ease;
        margin-bottom: 12px;
      }
      .book:hover .cover {
        box-shadow: var(--shadow-hover);
      }
      .cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .book:hover .cover img {
        transform: scale(1.04);
      }
      /* заглушка без обложки: первая буква названия */
      .cover .stub {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 56px;
        font-weight: 700;
        color: var(--accent);
        opacity: 0.35;
        letter-spacing: -0.02em;
      }
      .cover .badge {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.03em;
        padding: 4px 10px;
        border-radius: 980px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .cover .badge.open {
        color: #fff;
        background: color-mix(in srgb, var(--accent) 88%, transparent);
      }
      .cover .badge.lock {
        color: #fff;
        background: rgba(94, 70, 20, 0.72);
      }

      .book .name {
        font-size: var(--name-size);
        font-weight: var(--name-weight);
        letter-spacing: -0.01em;
        line-height: 1.3;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        margin-bottom: 4px;
      }
      .book:hover .name {
        color: var(--accent-dark);
      }
      .book .author {
        font-size: 13.5px;
        color: var(--ink-soft);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .book .meta {
        font-size: 12.5px;
        color: var(--ink-faint);
        margin-top: 2px;
      }

      /* ——— Пустые состояния ——— */
      .empty {
        grid-column: 1 / -1;
        text-align: center;
        color: var(--ink-faint);
        font-size: 15px;
        padding: 48px 24px;
        background: var(--card);
        border: 1px dashed var(--line);
        border-radius: var(--radius);
      }
      .search-empty {
        display: none;
        width: 100%;
        max-width: 1080px;
        text-align: center;
        color: var(--ink-faint);
        font-size: 15px;
        padding: 40px 24px;
      }
      .search-empty.show {
        display: block;
      }

      /* ——— Подробный просмотр книги ——— */
      .detail-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(29, 29, 31, 0.45);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: grid;
        place-items: center;
        padding: 20px;
        z-index: 60;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      .detail-backdrop.show {
        opacity: 1;
        pointer-events: auto;
      }
      .detail {
        width: 100%;
        max-width: 640px;
        max-height: calc(100vh - 40px);
        overflow-y: auto;
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: var(--shadow-hover);
        padding: 28px;
        display: grid;
        grid-template-columns: 168px 1fr;
        gap: 24px;
        transform: translateY(14px) scale(0.98);
        transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
        position: relative;
      }
      .detail-backdrop.show .detail {
        transform: none;
      }
      .detail .d-cover {
        aspect-ratio: 3 / 4;
        border-radius: 14px;
        overflow: hidden;
        background: linear-gradient(135deg, #e8e8ed 0%, #f5f5f7 100%);
        box-shadow: var(--shadow);
        display: grid;
        place-items: center;
      }
      .detail .d-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .detail .d-cover .stub {
        font-size: 52px;
        font-weight: 700;
        color: var(--accent);
        opacity: 0.35;
      }
      .detail .d-name {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.15;
        margin-bottom: 6px;
      }
      .detail .d-author {
        font-size: 15px;
        color: var(--ink-soft);
        margin-bottom: 2px;
      }
      .detail .d-meta {
        font-size: 13px;
        color: var(--ink-faint);
        margin-bottom: 16px;
      }
      .detail .d-desc {
        font-size: 14.5px;
        line-height: 1.6;
        color: var(--ink);
        margin-bottom: 20px;
      }
      .detail .d-desc:empty {
        display: none;
      }
      .detail .d-desc ul,
      .detail .d-desc ol {
        padding-left: 22px;
      }
      .detail .d-read {
        display: inline-block;
        font: inherit;
        font-weight: 600;
        font-size: 15px;
        color: #fff;
        background: var(--accent);
        text-decoration: none;
        border-radius: 980px;
        padding: 12px 26px;
        transition: background 0.2s ease, transform 0.2s ease;
      }
      .detail .d-read:hover {
        background: var(--accent-dark);
        transform: translateY(-1px);
      }
      .detail .d-closed {
        display: inline-block;
        font-size: 14px;
        color: var(--ink-faint);
        border: 1px dashed var(--line);
        border-radius: 980px;
        padding: 10px 22px;
      }
      .detail .d-close {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 34px;
        height: 34px;
        border: none;
        border-radius: 50%;
        background: #f0f0f3;
        color: var(--ink-soft);
        font-size: 17px;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background 0.2s ease;
      }
      .detail .d-close:hover {
        background: #e4e4e9;
      }
      @media (max-width: 560px) {
        .detail {
          grid-template-columns: 1fr;
          padding: 22px;
        }
        .detail .d-cover {
          max-width: 200px;
        }
      }

      /* ——— Footer ——— */
      footer {
        margin-top: 80px;
        font-size: 13px;
        color: var(--ink-faint);
        text-align: center;
        letter-spacing: 0.01em;
      }
      footer a {
        color: var(--ink-soft);
        text-decoration: none;
        border-bottom: 1px solid #d2d2d7;
        transition:
          color 0.2s ease,
          border-color 0.2s ease;
      }
      footer a:hover {
        color: var(--ink);
        border-color: var(--ink);
      }

      /* ——— Animations ——— */
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ——— Mobile ——— */
      @media (max-width: 560px) {
        body {
          padding: 56px 16px 48px;
        }
        .books {
          grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
          gap: 16px;
        }
        .hero {
          margin-bottom: 32px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
        html {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <span class="eyebrow" id="siteEyebrow"></span>
      <h1 id="siteTitle"></h1>
      <p class="subtitle" id="siteSubtitle"></p>
    </header>

    <div class="search">
      <input
        type="search"
        id="searchInput"
        placeholder="Найти книгу по названию или автору…"
        aria-label="Поиск книги по названию или автору"
      />
    </div>

    <main class="books" id="books"></main>
    <div class="search-empty" id="searchEmpty">Ничего не найдено. Попробуйте другой запрос.</div>

    <!-- Подробный просмотр книги -->
    <div class="detail-backdrop" id="detailBackdrop">
      <div class="detail" role="dialog" aria-modal="true" aria-labelledby="dName">
        <button class="d-close" id="detailClose" aria-label="Закрыть">✕</button>
        <div class="d-cover" id="dCover"></div>
        <div>
          <div class="d-name" id="dName"></div>
          <div class="d-author" id="dAuthor"></div>
          <div class="d-meta" id="dMeta"></div>
          <div class="d-desc" id="dDesc"></div>
          <span id="dAction"></span>
        </div>
      </div>
    </div>

    <script>
      /* Встроенный снимок данных: страница работает, даже если books.json
         ещё не загрузился. Админка обновляет этот блок при публикации. */
      const EMBEDDED = /*DATA_PLACEHOLDER*/null;

      /* Шрифтовые темы — выбираются в админке */
      const FONT_STACKS = {
        system:
          '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
        serif: 'Georgia, "Times New Roman", "PT Serif", serif',
        rounded:
          'ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif',
      };

      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      /* Применяем тексты и оформление */
      function applySite(site) {
        const s = site || {};
        document.getElementById("siteEyebrow").textContent =
          s.eyebrow || "Личная подборка";
        document.getElementById("siteTitle").textContent =
          s.title || "Мои книги";
        document.getElementById("siteSubtitle").textContent =
          s.subtitle || "Всё в одном месте. Нажми — книга откроется.";
        document.title = s.title || "Мои книги";
        const root = document.documentElement.style;
        root.setProperty("--font-stack", FONT_STACKS[s.font] || FONT_STACKS.system);
        if (s.titleSize) root.setProperty("--h1-size", s.titleSize + "px");
        if (s.titleWeight) root.setProperty("--h1-weight", s.titleWeight);
        if (s.nameSize) root.setProperty("--name-size", s.nameSize + "px");
        if (s.nameWeight) root.setProperty("--name-weight", s.nameWeight);
        if (s.accent) {
          root.setProperty("--accent", s.accent);
          /* тёмный вариант акцента для hover-состояний */
          root.setProperty("--accent-dark", s.accent);
        }
      }

      /* Очистка аннотации от чужеродной разметки: белый список тегов,
         никаких скриптов и обработчиков — только простое форматирование. */
      function sanitizeRich(html) {
        const ALLOWED = {
          B: 1, STRONG: 1, I: 1, EM: 1, U: 1, BR: 1, P: 1, DIV: 1,
          UL: 1, OL: 1, LI: 1, SPAN: 1,
        };
        const doc = new DOMParser().parseFromString(String(html || ""), "text/html");
        (function walk(node) {
          [...node.children].forEach((el) => {
            if (!ALLOWED[el.tagName]) {
              el.replaceWith(...[...el.childNodes]);
              return;
            }
            [...el.attributes].forEach((a) => {
              if (a.name.toLowerCase() === "style") {
                const ff = el.style.fontFamily, fs = el.style.fontSize;
                el.removeAttribute("style");
                let keep = "";
                if (ff) keep += "font-family:" + ff.replace(/[";<>]/g, "") + ";";
                if (fs && /^\d{1,2}(\.\d+)?(px|em|rem|%)$/.test(fs)) keep += "font-size:" + fs + ";";
                if (keep) el.setAttribute("style", keep);
              } else {
                el.removeAttribute(a.name);
              }
            });
            if (el.isConnected) walk(el);
          });
        })(doc.body);
        return doc.body.innerHTML.trim();
      }

      /* Текст аннотации без тегов — для поиска */
      const plainText = (html) => {
        const d = document.createElement("div");
        d.innerHTML = sanitizeRich(html);
        return d.textContent || "";
      };

      /* Карточка книги: клик открывает подробный просмотр с аннотацией. */
      function cardHtml(b, i) {
        const isOpen = b.access !== "closed" && b.url;
        const coverInner = b.cover
          ? `<img src="${esc(b.cover)}" alt="Обложка «${esc(b.name)}»" loading="lazy" />`
          : `<span class="stub" aria-hidden="true">${esc((b.name || "?").trim().charAt(0).toUpperCase())}</span>`;
        const search = esc(
          (
            b.name + " " + (b.author || "") + " " +
            plainText(b.description) + " " + (b.meta || "")
          ).toLowerCase(),
        );
        return `
  <button class="book" type="button" data-idx="${i}" data-search="${search}"
     aria-label="Подробнее о книге «${esc(b.name)}»" style="--i:${i}">
      <span class="cover">
        ${coverInner}
        <span class="badge ${isOpen ? "open" : "lock"}">${isOpen ? "читать" : "закрытая"}</span>
      </span>
      <span class="name">${esc(b.name)}</span>
      ${b.author ? `<span class="author">${esc(b.author)}</span>` : ""}
      ${b.meta ? `<span class="meta">${esc(b.meta)}</span>` : ""}
  </button>`;
      }

      /* ── Подробный просмотр ── */
      const detailBackdrop = document.getElementById("detailBackdrop");
      let currentBooks = [];

      function openDetail(b) {
        document.getElementById("dCover").innerHTML = b.cover
          ? `<img src="${esc(b.cover)}" alt="Обложка «${esc(b.name)}»" />`
          : `<span class="stub">${esc((b.name || "?").trim().charAt(0).toUpperCase())}</span>`;
        document.getElementById("dName").textContent = b.name || "";
        document.getElementById("dAuthor").textContent = b.author || "";
        document.getElementById("dMeta").textContent = b.meta || "";
        document.getElementById("dDesc").innerHTML = sanitizeRich(b.description);
        const isOpen = b.access !== "closed" && b.url;
        /* трекинг клика GoatCounter переехал на кнопку «Читать» */
        document.getElementById("dAction").innerHTML = isOpen
          ? `<a class="d-read" href="${esc(b.url)}" target="_blank" rel="noopener"
               data-goatcounter-click="open-book: ${esc(b.name)}"
               data-goatcounter-title="Открыли книгу: ${esc(b.name)}">Читать</a>`
          : `<span class="d-closed">Книга пока закрыта для чтения</span>`;
        detailBackdrop.classList.add("show");
        document.body.style.overflow = "hidden";
        if (window.goatcounter && window.goatcounter.bind_events) {
          window.goatcounter.bind_events();
        }
      }
      function closeDetail() {
        detailBackdrop.classList.remove("show");
        document.body.style.overflow = "";
      }
      document.getElementById("detailClose").addEventListener("click", closeDetail);
      detailBackdrop.addEventListener("click", (e) => {
        if (e.target === detailBackdrop) closeDetail();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeDetail();
      });

      function render(data) {
        applySite(data.site);
        const books = data.books || [];
        currentBooks = books;
        const booksEl = document.getElementById("books");
        const searchInput = document.getElementById("searchInput");
        const searchEmpty = document.getElementById("searchEmpty");
        if (books.length === 0) {
          booksEl.innerHTML =
            '<div class="empty">Пока здесь пусто — книги скоро появятся.</div>';
          return;
        }
        booksEl.innerHTML = books.map(cardHtml).join("");
        /* клик по карточке → подробный просмотр (слушатель вешается один раз) */
        if (!booksEl.dataset.clickBound) {
          booksEl.dataset.clickBound = "1";
          booksEl.addEventListener("click", (e) => {
            const card = e.target.closest(".book[data-idx]");
            if (card && currentBooks[+card.dataset.idx])
              openDetail(currentBooks[+card.dataset.idx]);
          });
        }
        /* поиск всегда активен: ищет по названию, автору, аннотации */
        searchInput.addEventListener("input", () => {
          const q = searchInput.value.trim().toLowerCase();
          let visible = 0;
          booksEl.querySelectorAll("[data-search]").forEach((el) => {
            const hit = !q || el.dataset.search.includes(q);
            el.classList.toggle("hidden-by-search", !hit);
            if (hit) visible++;
          });
          searchEmpty.classList.toggle("show", visible === 0);
        });
      }

      /* Сначала встроенный снимок (мгновенный показ), затем свежий books.json */
      if (EMBEDDED) render(EMBEDDED);
      fetch("books.json?_=" + Date.now(), { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : null))
        .then((data) => {
          if (data && Array.isArray(data.books)) render(data);
        })
        .catch(() => {
          /* офлайн или books.json ещё не создан — остаётся встроенный снимок */
          if (!EMBEDDED) render({ books: [] });
        });
    </script>

    <!-- Счётчик GoatCounter -->
    <script
